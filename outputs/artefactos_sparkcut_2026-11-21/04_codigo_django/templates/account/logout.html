{% extends "base.html" %}

{% block title %}Salir — SparkCut{% endblock %}

{% block content %}
  <div class="auth-card panel">
    <h1 style="font-size: 32px">Cerrar sesión</h1>
    <p class="muted">¿Seguro que quieres terminar tu sesión?</p>
    <form method="post" action="{% url 'account_logout' %}" style="margin-top: 24px">
      {% csrf_token %}
      <div class="row">
        <button class="btn btn-danger" type="submit">Salir</button>
        <a class="btn btn-secondary" href="/dashboard/">Cancelar</a>
      </div>
    </form>
  </div>
{% endblock %}
