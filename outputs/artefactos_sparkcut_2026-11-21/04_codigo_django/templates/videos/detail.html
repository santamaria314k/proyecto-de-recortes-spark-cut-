{% extends "base.html" %}
{% block title %}{{ video.title }} — SparkCut{% endblock %}
{% block content %}
  <a class="muted" href="/dashboard/">← Volver al panel</a>
  <h1 style="font-size: 34px; margin-top: 12px">{{ video.title }}</h1>

  <div class="panel" style="margin-top: 24px">
    <div class="row" style="justify-content: space-between">
      <div class="stack">
        <span class="badge" id="status-label">{{ video.get_status_display }}</span>
        <span class="muted">Progreso: <span id="progress-label">{{ video.progress }}</span>%</span>
      </div>
      <a class="btn btn-secondary" href="/videos/{{ video.pk }}/clips/">Ver clips</a>
    </div>
    <div class="progress" style="margin-top: 18px">
      <span id="progress-bar" style="width: {{ video.progress }}%"></span>
    </div>
    <p class="error" id="error-label" {% if not video.error %}style="display:none"{% endif %}>{{ video.error }}</p>
  </div>

  <script>
    const statusUrl = "/videos/{{ video.pk }}/status/";
    async function poll() {
      try {
        const response = await fetch(statusUrl, { headers: { "Accept": "application/json" } });
        if (!response.ok) return;
        const data = await response.json();
        document.getElementById("status-label").textContent = data.status_display || data.status;
        document.getElementById("progress-label").textContent = data.progress;
        document.getElementById("progress-bar").style.width = data.progress + "%";
        const errorLabel = document.getElementById("error-label");
        errorLabel.textContent = data.error || "";
        errorLabel.style.display = data.error ? "block" : "none";
        if (data.status !== "done" && data.status !== "failed") {
          setTimeout(poll, 2000);
        }
      } catch (error) {
        setTimeout(poll, 4000);
      }
    }
    if ("{{ video.status }}" !== "done" && "{{ video.status }}" !== "failed") {
      setTimeout(poll, 1000);
    }
  </script>
{% endblock %}
