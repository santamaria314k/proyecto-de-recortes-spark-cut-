apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - secret.yaml
  - mysql.yaml
  - redis.yaml
  - media-pvc.yaml
  - migrate-job.yaml
  - web.yaml
  - worker.yaml
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: sparkcut
    includeSelectors: false

images:
  - name: sparkcut
    newTag: latest
