apiVersion: batch/v1
kind: Job
metadata:
  name: sparkcut-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h mysql -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent; do
                echo "esperando a mysql"; sleep 3;
              done
          env:
            - name: MYSQL_USER
              value: sparkcut
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sparkcut-secret
                  key: MYSQL_PASSWORD
      containers:
        - name: migrate
          image: sparkcut:latest
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: sparkcut-config
            - secretRef:
                name: sparkcut-secret
