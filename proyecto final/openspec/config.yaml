schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English
  (also WHEN/THEN/AND in scenarios).

  Project: SparkCut — aplicación web que convierte videos largos (hasta 20 min / 500 MB)
  en clips cortos con alto potencial viral (puntaje 10–100).
  Stack: Django 5 (MVT) + MySQL 8 + Celery/Redis + faster-whisper + RNN BiGRU propia (PyTorch)
  + ffmpeg, desplegado en Kubernetes con Kustomize.
  Reglas de arquitectura: la web nunca procesa video (todo en workers); los módulos de IA y video
  son Python puro sin dependencia de Django; todo recurso se filtra por usuario (404 si es ajeno).
  Los contratos (módulos Python, endpoints, artefactos del modelo) se actualizan primero en OpenSpec.
  Contexto completo en openspec/project.md.

rules:
  proposal:
    - Indicar siempre qué queda fuera de alcance
    - Referenciar los RF/RNF y casos de uso (CU) que satisface el cambio
    - Indicar qué contratos cambian (módulos Python, endpoints, artefactos del modelo)
  specs:
    - Describir comportamiento observable; los detalles de implementación van en design.md o project.md
    - Cada requirement debe contener SHALL o MUST y al menos un scenario con WHEN/THEN
    - Los scenarios deben ser verificables (valores, códigos HTTP y estados concretos, no adjetivos como «rápido»)
    - Incluir al menos un scenario de error o de borde por requirement cuando aplique
    - Mantener la referencia a RF/RNF y la prioridad MoSCoW cuando exista
  design:
    - Registrar las decisiones como ADR (contexto, decisión, alternativas descartadas)
    - Indicar el impacto en los contratos entre Kevin y Andrés
  tasks:
    - Dividir en tareas de máximo 2 horas
    - Incluir una tarea de pruebas (pytest) por cada requirement nuevo

# Per-operation guidance (optional)
# operations:
#   apply:
#     guidance:
#       - Keep test summaries concise
#   archive:
#     guidance:
#       - Summarize the archive outcome before finishing
